<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OrbitFocus — order page example</title>
<link rel="stylesheet" href="../../dist/orbit-focus.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;font-family:Helvetica,Arial,sans-serif}
  #gallery{height:100%}
  .hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;color:#777;font-size:14px;pointer-events:none;z-index:10}

  /* order page (slides up when you click the big image) */
  #order{position:fixed;inset:0;z-index:2000;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
  #order.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#ececec}
  .top button{background:#111;color:#fff;border:0;font:inherit;font-size:15px;padding:6px 12px;cursor:pointer}
  .body{max-width:560px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
  .hero{height:min(46vh,340px);background:#ddd center/cover no-repeat;margin:16px 0}
  h2{margin:0 0 4px;font-size:24px}.price{color:#555;font-size:18px;margin-bottom:14px}
  .qty{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .qty button{width:40px;height:40px;border:0;background:#ececec;font-size:22px;cursor:pointer}
  .qty .tot{margin-left:auto;font-weight:600;font-size:18px}
  label{display:block;font-size:14px;color:#555;margin-bottom:12px}
  input,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid #ccc;font:inherit;font-size:16px;border-radius:0}
  .primary{width:100%;padding:14px;border:0;background:#111;color:#fff;font:inherit;font-size:17px;cursor:pointer}
  #err{color:#c62828;font-size:14px;min-height:20px;margin:8px 0 0}
</style>
</head>
<body>

<div id="gallery"></div>
<div class="hint">Scroll / swipe to browse · click the big image to order</div>

<div id="order" inert>
  <div class="top"><button type="button" id="back">← Back</button><b>Place your order</b></div>
  <div class="body">
    <div class="hero" id="hero"></div>
    <h2 id="name"></h2>
    <div class="price" id="price"></div>
    <div class="qty">
      <button type="button" id="minus" aria-label="Less">−</button><span id="qty">1</span>
      <button type="button" id="plus" aria-label="More">+</button><span class="tot" id="total"></span>
    </div>
    <form id="form" novalidate>
      <label>Full name<input id="fName" autocomplete="name"></label>
      <label>Phone number<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel"></label>
      <label>Delivery address<textarea id="fAddr" rows="2" autocomplete="street-address"></textarea></label>
      <label>Notes (optional)<textarea id="fNote" rows="2"></textarea></label>
      <button class="primary" type="submit">Place order</button>
      <p id="err"></p>
    </form>
    <div id="done" hidden></div>
  </div>
</div>

<script src="../../dist/orbit-focus.global.js"></script>
<script>
  // ----- settings -----
  const CUR = 'TND';            // currency label
  const ORDER_WHATSAPP = '';    // optional, e.g. '21612345678' → the order opens in WhatsApp

  // ----- your products: any online image URL works -----
  const products = [['Nordhaus',10,18],['Aster Bloom',20,22],['Halcyon Type',30,15],['Ink Study',40,25],
    ['Shadow Walk',50,19],['Kairo Editions',60,30],['Static Field',70,16],['Soft Face',80,21],
    ['Red Line',90,24],['Paper Sun',101,17],['Grain Room',111,28],['Blue Form',121,20]]
    .map(([title, id, price]) => ({
      title, price,
      image: `https://picsum.photos/id/${id}/700/800`,
      thumb: `https://picsum.photos/id/${id}/300/400`
    }));

  new OrbitFocus('#gallery', { items: products, buttonLabel: 'Order now', onActivate: openOrder });

  // ----- order page -----
  const $ = (id) => document.getElementById(id);
  const order = $('order');
  let cur = null, qty = 1;
  const money = (n) => `${n} ${CUR}`;
  const refresh = () => { $('qty').textContent = qty; $('total').textContent = money(cur.price * qty); };

  function openOrder(item) {
    cur = item; qty = 1;
    $('hero').style.backgroundImage = `url("${item.image}")`;
    $('name').textContent = item.title;
    $('price').textContent = money(item.price) + ' each';
    $('form').hidden = false; $('done').hidden = true; $('err').textContent = '';
    refresh();
    order.scrollTop = 0; order.inert = false; order.classList.add('open');
    $('back').focus({ preventScroll: true });
  }
  function closeOrder() {
    if (order.contains(document.activeElement)) document.activeElement.blur();
    order.inert = true; order.classList.remove('open');
  }
  $('back').onclick = closeOrder;
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOrder(); });
  $('minus').onclick = () => { qty = Math.max(1, qty - 1); refresh(); };
  $('plus').onclick  = () => { qty = Math.min(20, qty + 1); refresh(); };

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = fName.value.trim(), phone = fPhone.value.trim(), addr = fAddr.value.trim(), note = fNote.value.trim();
    if (!name || phone.replace(/\D/g, '').length < 8 || !addr) {
      $('err').textContent = 'Please enter your name, a valid phone number and your address.'; return;
    }
    const msg = `New order\n${qty} × ${cur.title} — ${money(cur.price * qty)}\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}` + (note ? `\nNotes: ${note}` : '');
    console.log(msg);   // ← replace with a fetch() to your own server to really save orders
    if (ORDER_WHATSAPP) window.open(`https://wa.me/${ORDER_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
    $('form').hidden = true; $('done').hidden = false;
    $('done').innerHTML = '<p style="font-size:17px;line-height:1.5"><b>Thank you!</b> Your order has been received.</p><button type="button" class="primary" id="again">Back to gallery</button>';
    $('again').onclick = closeOrder;
  });
</script>
</body>
</html>
